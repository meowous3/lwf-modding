<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guides — Lazy Witch's Factory modding</title>
<meta name="description" content="Modding guides for Lazy Witch's Factory.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="index.html">Lazy Witch&rsquo;s Factory <span>modding</span></a>
    <nav>
      <a href="mods.html">Mods</a>
      <a href="guides.html" class="on">Guides</a>
      <a href="https://github.com/meowous3/lwf-modding">GitHub</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <h1>Guides</h1>
  <div id="guides" class="grid"><p class="loading">Loading&hellip;</p></div>
</main>
<script type="module">
import { manifest, el, escape } from './lib.js';
(async () => {
  const host = document.getElementById('guides');
  try {
    const { guides } = await manifest('guides');
    host.replaceChildren(...guides.map((g) => el(`
      <article class="card">
        <h3><a href="guide.html?g=${encodeURIComponent(g.slug)}">${escape(g.title)}</a></h3>
        <p class="tagline">${escape(g.audience)}</p>
        <p class="desc">${escape(g.blurb)}</p>
      </article>`)));
  } catch { host.innerHTML = '<p class="error">Could not load the guides.</p>'; }
})();
</script>
<footer class="wrap">
  <p>MIT. Not affiliated with the developers of Lazy Witch&rsquo;s Factory.</p>
</footer>
</body>
</html>
