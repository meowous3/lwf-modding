<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mods — Lazy Witch's Factory modding</title>
<meta name="description" content="BepInEx mods for Lazy Witch's Factory.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="index.html">Lazy Witch&rsquo;s Factory <span>modding</span></a>
    <nav>
      <a href="mods.html" class="on">Mods</a>
      <a href="guides.html">Guides</a>
      <a href="https://github.com/meowous3/lwf-modding">GitHub</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <h1>Mods</h1>
  <div id="mods" class="grid"><p class="loading">Loading&hellip;</p></div>
</main>
<script type="module">
import { manifest, modCard } from './lib.js';
(async () => {
  const host = document.getElementById('mods');
  try {
    const { mods } = await manifest('mods');
    host.replaceChildren(...await Promise.all(mods.map(modCard)));
  } catch { host.innerHTML = '<p class="error">Could not load the mod list.</p>'; }
})();
</script>
<footer class="wrap">
  <p>MIT. Not affiliated with the developers of Lazy Witch&rsquo;s Factory.</p>
</footer>
</body>
</html>
