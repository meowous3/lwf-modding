<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guide — Lazy Witch's Factory modding</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="index.html">Lazy Witch&rsquo;s Factory <span>modding</span></a>
    <nav>
      <a href="mods.html">Mods</a>
      <a href="guides.html" class="on">Guides</a>
      <a href="https://github.com/meowous3/lwf-modding">GitHub</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <p class="crumb"><a href="guides.html">&larr; Guides</a></p>
  <div class="page-head">
    <div>
      <h1 id="title">&nbsp;</h1>
      <p class="desc" id="desc"></p>
    </div>
    <div class="actions" id="actions"></div>
  </div>
  <article id="body" class="md panel"><p class="loading">Loading&hellip;</p></article>
</main>
<script type="module">
import { manifest, guideBody, escape } from './lib.js';

const slug = new URLSearchParams(location.search).get('g') || '';
const body = document.getElementById('body');

(async () => {
  const { guides } = await manifest('guides').catch(() => ({ guides: [] }));
  const guide = guides.find((g) => g.slug === slug);
  if (!guide) {
    document.getElementById('title').textContent = 'Not found';
    body.innerHTML = '<p class="error">No such guide. <a href="guides.html">Back to guides.</a></p>';
    return;
  }

  document.title = guide.title + ' — Lazy Witch’s Factory modding';
  document.getElementById('title').textContent = guide.title;
  document.getElementById('desc').textContent = guide.audience;
  document.getElementById('actions').innerHTML =
    `<a class="btn ghost" href="https://github.com/meowous3/lwf-modding/blob/master/${escape(guide.file)}">Source</a>`;

  try {
    body.innerHTML = await guideBody(guide.file);
  } catch {
    body.innerHTML = `<p class="error">Could not load this guide. <a href="https://github.com/meowous3/lwf-modding/blob/master/${escape(guide.file)}">Read it on GitHub.</a></p>`;
  }
})();
</script>
<footer class="wrap">
  <p>MIT. Not affiliated with the developers of Lazy Witch&rsquo;s Factory.</p>
</footer>
</body>
</html>
